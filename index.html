<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
  <meta name="theme-color" content="#090b25">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Vini ♥ Line">
  <meta name="description" content="Um pequeno jogo de carinho, de Vini para Line.">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="assets/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="assets/icon.svg">
  <link rel="stylesheet" href="style.css">
  <title>Vini ♥ Line</title>
</head>
<body>
  <main id="game" aria-label="Jogo de pegar corações">
    <canvas id="canvas" aria-hidden="true"></canvas>

    <div id="hud" class="hud" aria-live="polite">
      <div class="score"><span aria-hidden="true">♥</span><strong id="score">0</strong></div>
      <button id="sound" class="sound" type="button" aria-label="Ativar som" aria-pressed="false">
        <svg class="sound-on" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9v6h4l5 4V5L8 9H4zm12.3-.7a5 5 0 0 1 0 7.4m2.5-9.9a8.5 8.5 0 0 1 0 12.4"/></svg>
        <svg class="sound-off" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9v6h4l5 4V5L8 9H4zm12 1 5 5m0-5-5 5"/></svg>
      </button>
    </div>

    <section id="intro" class="intro" aria-label="Início">
      <div class="intro-mark" aria-hidden="true">
        <span>Vini</span><i></i><b>♥</b><i></i><span>Line</span>
      </div>
      <button id="start" type="button">toque para começar</button>
    </section>

    <div id="rotate-note" role="status">fica ainda mais bonito na vertical <span>♡</span></div>
  </main>
  <noscript>Este pequeno jogo precisa de JavaScript para funcionar.</noscript>
  <script src="game.js" defer></script>
</body>
</html>
